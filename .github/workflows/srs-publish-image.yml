name: SRS - Publicar AstraCalls

on:
  push:
    branches:
      - 'srs/update-*'
      - 'srs/production'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: srs-astracalls-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gabsouzadev/astracalls
  TAG: srs-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    if: github.repository == 'GabSouzaDev/AstraCalls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar código e testes
        run: |
          go vet ./...
          go test -race -count=1 ./...

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BUILD_REV=${{ github.sha }}
            BUILD_VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=srs-astracalls-amd64
          cache-to: type=gha,mode=max,scope=srs-astracalls-amd64

      - name: Mostrar imagem publicada
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Imagem: $IMAGE:$TAG@$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
